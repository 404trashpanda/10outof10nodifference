<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10outof10nodifference</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  #momoa { max-width: 100vw; max-height: 100vh; }
  #start {
    font: 2rem sans-serif; padding: 1rem 2rem; margin: 1rem; cursor: pointer;
    border: none; border-radius: 0.5rem; background: #fff; color: #000;
  }
</style>
</head>
<body>
<button id="start">Click here for your personalized Raphi substitute</button>
<img id="momoa" alt="" hidden>
<script>
const IMAGES = Array.from({ length: 19 }, (_, i) => `images/${i + 1}.jpg`);
const SOUNDS = Array.from({ length: 5 }, (_, i) => new Audio(`sounds/${i + 1}.mp3`));

const img = document.getElementById("momoa");
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let deck = [];
let shown;

function nextImage() {
  if (deck.length === 0) {
    deck = IMAGES.slice();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    // Avoid repeating the last image of the previous deck right after a reshuffle.
    const top = deck.length - 1;
    if (deck[top] === shown) [deck[0], deck[top]] = [deck[top], deck[0]];
  }
  shown = deck.pop();
  return shown;
}
function scheduleNext(delay) {
  setTimeout(async () => {
    scheduleNext(5 + Math.random() * 5);
    img.src = nextImage();
    await img.decode();
    img.hidden = false;
    const sound = pick(SOUNDS);
    sound.currentTime = 0;
    sound.play();
  }, delay * 1000);
}

document.getElementById("start").addEventListener("click", e => {
  e.target.remove();
  // Mobile browsers only let an audio element play later if it was first played during a user gesture.
  for (const s of SOUNDS) {
    s.muted = true;
    s.play().then(() => { s.pause(); s.muted = false; });
  }
  scheduleNext(3);
});
</script>
</body>
</html>
