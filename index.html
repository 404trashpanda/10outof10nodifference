<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10outof10nodifference</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #momoa { max-width: 100vw; max-height: 100vh; }
  #start {
    font: 2rem sans-serif; padding: 1rem 2rem; margin: 1rem; cursor: pointer;
    border: none; border-radius: 0.5rem; background: #fff; color: #000;
  }
</style>
</head>
<body>
<button id="start">Click here for your personalized Raphi substitute</button>
<img id="momoa" alt="" hidden>
<script src="weights.js"></script>
<script>
const IMAGES = Array.from({ length: 26 }, (_, i) => `images/${i + 1}.jpg`);
const SOUNDS = Array.from({ length: 18 }, (_, i) => new Audio(`sounds/${i + 1}.mp3`));

const img = document.getElementById("momoa");
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// Chance that a picture+fart combo is "good", from the scores in weights.js (fitted from ratings).
// Picking by it keeps clear losers rare while near-equal combos come up about equally often.
function goodness(image, sound) {
  const score = IMAGE_SCORES[image - 1] + SOUND_SCORES[sound - 1] + PORTRAIT_LONG * PORTRAIT[image - 1] * LONG_SOUND[sound - 1];
  return 1 / (1 + Math.exp(-(GOOD_CUT + score)));
}

// Starts with one of the best combos; skips the last 8 pictures and the last fart.
const recentImages = [];
let lastSoundNo = null, combos = 0;
function nextCombo() {
  let image, sound;
  if (combos++ === 0) [image, sound] = pick(BEST);
  else {
    const options = [];
    for (let i = 1; i <= IMAGES.length; i++)
      for (let j = 1; j <= SOUNDS.length; j++)
        if (!recentImages.includes(i) && j !== lastSoundNo) options.push([i, j, goodness(i, j)]);
    let r = Math.random() * options.reduce((sum, o) => sum + o[2], 0);
    [image, sound] = options.find(o => (r -= o[2]) < 0) || options[options.length - 1];
  }
  recentImages.push(image);
  if (recentImages.length > 8) recentImages.shift();
  lastSoundNo = sound;
  return { image, sound };
}

let ctx, analyser, buf;
// Routes every sound through an analyser so the shake can follow the fart's loudness.
function setupAudio() {
  if (navigator.audioSession) navigator.audioSession.type = "playback"; // otherwise iOS mutes Web Audio in silent mode
  ctx = new AudioContext();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  buf = new Float32Array(analyser.fftSize);
  analyser.connect(ctx.destination);
  for (const s of SOUNDS) ctx.createMediaElementSource(s).connect(analyser);
}

// 0..1, where 1 is an RMS of 0.25 (very loud; none of the current farts get there).
function loudness() {
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (const v of buf) sum += v * v;
  return Math.min(Math.sqrt(sum / buf.length) / 0.25, 1);
}

// Turns the shake down for loud and long farts: loudness above 0.5 counts half,
// and the shake eases to 80% over a long fart. Short ones are barely affected.
function tame(level, t) {
  const compressed = level <= 0.5 ? level : 0.5 + (level - 0.5) * 0.5;
  return compressed * (1 - 0.2 * Math.min(Math.max((t - 0.5) / 1.5, 0), 1));
}

// Smooth pseudo-random motion in -1..1 from two sine waves (about 5.5 and 8.5 Hz).
const wobble = (t, phase) => 0.6 * Math.sin(t * 35 + phase) + 0.4 * Math.sin(t * 53 + phase * 2.3);

// Shakes the picture in step with the fart until it has finished and settled.
// Audio takes `latency` seconds to come out of the speakers (Bluetooth: ~0.2 s), so loudness
// readings are used that much later, and show() is called when the fart starts being heard.
function quake(sound, latency, show) {
  const phase = Math.random() * 100;
  const readings = [];
  let level = 0, t = 0, last = null, lastPlaying = performance.now();
  const frame = now => {
    readings.push([now, loudness()]);
    const heard = now - latency * 1000;
    while (readings.length > 1 && readings[1][0] <= heard) readings.shift();
    if (readings[0][0] > heard) return requestAnimationFrame(frame);
    if (last === null) { show(); last = now; }
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; t += dt;
    const l = readings[0][1];
    level = l > level ? level + (l - level) * 0.5 : level * 0.9;
    const k = tame(level, t);
    img.style.transform =
      `translate(${wobble(t, phase) * k * 30}px, ${wobble(t, phase + 1.7) * k * 30}px) rotate(${wobble(t, phase + 3.1) * k * 3}deg)`;
    if (!sound.paused && !sound.ended) lastPlaying = now;
    if (now - lastPlaying <= latency * 1000 || level >= 0.01) requestAnimationFrame(frame);
    else img.style.transform = "";
  };
  requestAnimationFrame(frame);
}

let timer;
function scheduleNext(delay) {
  timer = setTimeout(async () => {
    scheduleNext(5 + Math.random() * 3);
    const combo = nextCombo();
    const pic = new Image();
    pic.src = IMAGES[combo.image - 1];
    await pic.decode();
    const sound = SOUNDS[combo.sound - 1];
    sound.currentTime = 0;
    await sound.play().catch(() => {}); // resolves once playback has actually started
    quake(sound, (ctx.outputLatency || 0) + (ctx.baseLatency || 0), () => {
      img.src = pic.src;
      img.hidden = false;
    });
  }, delay * 1000);
}

document.getElementById("start").addEventListener("click", e => {
  e.target.remove();
  setupAudio();
  // Mobile browsers only let an audio element play later if play() was first called during a user gesture.
  // Pausing right away means nothing is heard (the interrupted play() rejects, hence the catch).
  for (const s of SOUNDS) {
    s.play().catch(() => {});
    s.pause();
  }
  scheduleNext(3);
});
</script>
</body>
</html>
